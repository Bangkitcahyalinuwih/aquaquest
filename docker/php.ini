; Pengaturan PHP tambahan untuk AquaQuest (production)
memory_limit = 256M
upload_max_filesize = 4M
post_max_size = 8M
expose_php = Off
date.timezone = Asia/Jakarta

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
; image bersifat immutable: perubahan kode berarti build image baru
opcache.validate_timestamps = 0
