# AquaQuest: aplikasi (Laravel + Apache) dan database (MySQL 8)
# Jalankan: docker compose up -d --build
name: aquaquest

services:
  app:
    build:
      context: .
      target: app
    image: aquaquest:local
    container_name: aquaquest-app
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage-public:/var/www/html/storage/app/public

  db:
    image: mysql:8.0
    container_name: aquaquest-db
    restart: unless-stopped
    env_file: .env.docker
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Opsional: antarmuka database. Jalankan dengan: docker compose --profile tools up -d
  adminer:
    image: adminer:4
    container_name: aquaquest-adminer
    profiles: ["tools"]
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  db-data:
  storage-public:
